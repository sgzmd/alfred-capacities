name: Build Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: alfred-capacities-release
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Read and validate version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          PLIST_VERSION="$(plutil -extract version raw info.plist)"
          PACKAGE_VERSION="$(node --print "require('./package.json').version")"

          if [[ ! "$PLIST_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "info.plist contains an invalid semantic version: $PLIST_VERSION" >&2
            exit 1
          fi

          if [[ "$PLIST_VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Version mismatch: info.plist=$PLIST_VERSION package.json=$PACKAGE_VERSION" >&2
            exit 1
          fi

          echo "version=$PLIST_VERSION" >> "$GITHUB_OUTPUT"

      - name: Check whether version is already released
        id: tag
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if git rev-parse --verify --quiet "refs/tags/v${VERSION}" >/dev/null; then
            echo "Version v${VERSION} is already released."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "Building release v${VERSION}."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.tag.outputs.exists == 'false'
        run: npm ci

      - name: Build and test
        if: steps.tag.outputs.exists == 'false'
        run: npm run check

      - name: Audit dependencies
        if: steps.tag.outputs.exists == 'false'
        run: npm audit

      - name: Package workflow
        if: steps.tag.outputs.exists == 'false'
        run: npm run package

      - name: Verify release archive
        if: steps.tag.outputs.exists == 'false'
        run: |
          plutil -lint dist/info.plist
          unzip -t Capacities_Quick_Capture.alfredworkflow

      - name: Create GitHub release
        if: steps.tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          target_commitish: ${{ github.sha }}
          name: Release v${{ steps.version.outputs.version }}
          files: Capacities_Quick_Capture.alfredworkflow
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: false
          prerelease: false
